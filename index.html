<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fußball-Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f1;--surface:#fff;--surface2:#f7faf7;--ink:#15211a;--muted:#5e6b63;--line:#d8dfd9;--accent:#1d7a4b;--accent2:#6cc690;--accent-ink:#fff;--live:#d6332b;--up:#1d7a4b;--down:#d6332b;--gold:#c79617;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#101713;--surface:#18211b;--surface2:#1c2a22;--ink:#e8efe9;--muted:#9aa8a0;--line:#2a372e;--accent:#3fbf80;--accent2:#6ec99e;--accent-ink:#0b130e;--live:#ff6a5f;--up:#3fbf80;--down:#ff6a5f;--gold:#f0c35d}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0 auto;background:var(--bg);color:var(--ink);font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:17px;line-height:1.4;max-width:720px;padding-bottom:2rem}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:1rem 1rem .5rem}
.top h1{margin:0;font-size:1.6rem;font-weight:700;display:flex;align-items:center;gap:.45rem}
.top h1::before{content:"🏆";font-size:1.1rem;filter:drop-shadow(0 2px 4px rgba(29,122,75,.25))}
.season{margin:0;color:var(--muted);font-size:.95rem}
.leagues{display:flex;gap:.5rem;overflow-x:auto;padding:.5rem 1rem;scrollbar-width:none}
.leagues::-webkit-scrollbar{display:none}
.leagues button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.4rem .9rem;border-radius:999px;font:inherit;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;box-shadow:0 2px 6px rgba(0,0,0,.03)}
.leagues button::before{content:"⚽";font-size:.8rem;opacity:.9}
.leagues button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:.25rem 1rem 0}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:.7rem 0;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.tabs button::before{font-size:.9rem}
.tabs button[data-view="table"]::before{content:"📊"}
.tabs button[data-view="matches"]::before{content:"📅"}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mdnav{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem}
.mdnav[hidden]{display:none}
.mdnav button{width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.4rem;line-height:1;cursor:pointer}
main{padding:.5rem 1rem}
.status{color:var(--muted);padding:1.5rem 0;text-align:center}
.status.error{color:var(--live)}
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
.standings{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.standings th,.standings td{padding:.55rem .5rem;text-align:center;border-bottom:1px solid var(--line)}
.standings thead th{color:var(--muted);font-weight:500;font-size:.9rem}
.standings tbody tr:last-child td{border-bottom:0}
.standings .team{text-align:left}
.standings td.team{display:flex;align-items:center;gap:.6rem}
.standings .pts{font-weight:700}
.standings .rank{font-weight:600;border-left:4px solid transparent}
.zone-up .rank{border-left-color:var(--up)}
.zone-down .rank{border-left-color:var(--down)}
@media(max-width:420px){.hide-s{display:none}}
.logo{width:24px;height:24px;object-fit:contain;flex:0 0 auto;display:inline-block}
section h2{font-size:.95rem;font-weight:600;color:var(--muted);margin:1.2rem 0 .4rem}
.match{background:linear-gradient(180deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:12px;margin-bottom:.5rem;box-shadow:0 6px 18px rgba(0,0,0,.04)}
.match summary{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.5rem;padding:.75rem;cursor:pointer;list-style:none}
.match summary::-webkit-details-marker{display:none}
.side{display:flex;align-items:center;gap:.5rem;font-weight:500}
.side.home{justify-content:flex-end;text-align:right}
.score{font-weight:700;font-size:1.15rem;min-width:3.4rem;text-align:center;font-variant-numeric:tabular-nums}
.match.live .score{color:var(--live)}
.detail{padding:0 .75rem .85rem;border-top:1px solid var(--line)}
.meta{color:var(--muted);font-size:.9rem;margin:.6rem 0}
.goals{list-style:none;padding:0;margin:0 0 .75rem}
.goals li{display:flex;gap:.6rem;padding:.2rem 0}
.goals .min{width:2.4rem;color:var(--muted);text-align:right}
.goals .gs{font-weight:600;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.analysis{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:.85rem;margin:.75rem 0;box-shadow:0 3px 12px rgba(0,0,0,.04)}
.analysis-title{font-weight:800;font-size:1.05rem;margin-bottom:.4rem}
.analysis p{margin:.3rem 0}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin-top:.7rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.65rem .4rem;text-align:center}
.stat b{display:block;font-size:1.1rem}
.stat span{display:block;color:var(--muted);font-size:.78rem}
.possession{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.7rem}
.pos{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.65rem;text-align:center}
.pos strong{font-size:1.3rem}
.bar{height:7px;background:var(--line);border-radius:99px;margin-top:.45rem;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--accent),#6cc690);border-radius:99px}
.video{display:inline-block;padding:.5rem .9rem;border-radius:6px;text-decoration:none;font-weight:600;border:1px solid var(--accent);color:var(--accent);box-shadow:0 4px 10px rgba(29,122,75,.08)}
.video.direct{background:var(--accent);color:var(--accent-ink)}
.broadcast{margin:.75rem 0;padding:.8rem;border-radius:11px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));box-shadow:0 6px 16px rgba(29,122,75,.06)}
.broadcast-head{font-weight:800;display:flex;align-items:center;gap:.4rem}
.broadcast-head::before{content:"📺";font-size:1rem}
.broadcast small{display:block;color:var(--muted);margin-top:.25rem}
.broadcast a{display:inline-block;margin-top:.55rem;margin-right:.3rem;padding:.45rem .75rem;border-radius:7px;text-decoration:none;font-weight:700;border:1px solid var(--accent);color:var(--accent)}
.broadcast a.direct{background:var(--accent);color:var(--accent-ink)}
.badges{display:flex;gap:.35rem;flex-wrap:wrap;margin:.5rem 0}
.badge{display:inline-flex;align-items:center;gap:.25rem;border-radius:999px;padding:.22rem .55rem;font-size:.78rem;font-weight:700;background:var(--surface);border:1px solid var(--line)}
.badge.green{border-color:#45b77c;color:var(--accent)}
.badge.gold{border-color:var(--gold);color:var(--gold)}
.goal-icon{font-size:1rem}
footer{color:var(--muted);font-size:.85rem;padding:1.5rem 1rem 0}
footer a{color:inherit}
</style>
</head>
<body>
<header class="top"><h1>Fußball-Hub</h1><p class="season" id="season"></p></header>
<nav class="leagues" id="leagues" aria-label="Liga wählen"></nav>
<nav class="tabs" role="tablist">
  <button role="tab" data-view="table" aria-selected="true">Tabelle</button>
  <button role="tab" data-view="matches" aria-selected="false">Spieltag</button>
</nav>
<div class="mdnav" id="mdnav" hidden>
  <button id="prev" aria-label="Vorheriger Spieltag">‹</button>
  <strong id="dayLabel"></strong>
  <button id="next" aria-label="Nächster Spieltag">›</button>
</div>
<main id="content" aria-live="polite"></main>
<footer>Daten: <a href="https://www.openligadb.de" target="_blank" rel="noopener">OpenLigaDB</a></footer>

<script>
"use strict";

const API_BASE = "https://api.openligadb.de";

// Regionalliga-Kürzel bitte auf openligadb.de prüfen und ggf. anpassen
const LEAGUES = [
  {id:"bl1", name:"Bundesliga"},
  {id:"bl2", name:"2. Bundesliga"},
  {id:"bl3", name:"3. Liga"},
  {id:"rl-nord", name:"Regionalliga Nord"},
  {id:"rl-nordost", name:"Regionalliga Nordost"},
  {id:"rl-west", name:"Regionalliga West"},
  {id:"rl-suedwest", name:"Regionalliga Südwest"},
  {id:"rl-bayern", name:"Regionalliga Bayern"}
];

const ZONES = {bl1:{up:4,down:2}, bl2:{up:2,down:3}, bl3:{up:2,down:4}};

// Eigene Videolinks: "matchID": "https://..."
const VIDEOS = {
  // "68123": "https://www.youtube.com/watch?v=XXXXXXXXXXX"
};

// Zusätzliche echte Spieldaten.
const MATCH_STATS = {
  /*
  "123456": {
    possession: [61, 39],
    shots: [15, 7],
    shotsOnTarget: [8, 3],
    xg: [2.10, 0.72],
    note: "Dortmund war über weite Strecken spielbestimmend und hatte deutlich mehr Ballbesitz."
  }
  */
};

// Konkrete Übertragung eines Spiels.
const BROADCASTS = {
  /*
  "123456": {
    name: "DAZN",
    type: "Live",
    url: "https://www.dazn.com/"
  }
  */
};

// Offizielle Quellen für die Regionalligen
const REGIONAL_SOURCES = {
  "rl-bayern": {
    name: "BFV",
    url: "https://www.bfv.de/spielbetrieb-verbandsleben/ligabetrieb/regionalliga-bayern",
    video: "https://www.bfv.tv/"
  },
  "rl-nord": {
    name: "NordFV Ergebnisdienst",
    url: "https://www.nordfv.de/spielbetrieb/ergebnisdienst/"
  },
  "rl-nordost": {
    name: "NOFV",
    url: "https://nofv-online.de/"
  },
  "rl-west": {
    name: "WDFV",
    url: "https://wdfv.de/"
  },
  "rl-suedwest": {
    name: "Regionalliga Südwest",
    url: "https://www.regionalliga-suedwest.de/"
  }
};

const SEASON = (() => { const d = new Date(); return d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1; })();

const state = {league: LEAGUES[0].id, view: "table", day: null};
const $ = s => document.querySelector(s);
const content = $("#content");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path){
  const r = await fetch(API_BASE + path);
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function setStatus(msg, err = false){
  content.innerHTML = `<p class="status ${err ? "error" : ""}">${esc(msg)}</p>`;
}

const logo = t => t.teamIconUrl ? `<img class="logo" src="${esc(t.teamIconUrl)}" alt="" loading="lazy" width="24" height="24">` : `<span class="logo"></span>`;

function finalResult(m){
  const rs = m.matchResults || [];
  const r = rs.find(x => x.resultTypeID === 2) || rs.slice(-1)[0];
  return r ? {a:r.pointsTeam1, b:r.pointsTeam2} : null;
}

function halfTime(m){
  const r = (m.matchResults || []).find(x => x.resultTypeID === 1);
  return r ? `${r.pointsTeam1}:${r.pointsTeam2}` : null;
}

function fmtDate(iso){
  if(!iso) return "Termin offen";
  return new Date(iso).toLocaleString("de-DE", {weekday:"short", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
}

function videoLink(m){
  const direct = VIDEOS[String(m.matchID)];
  if(direct) return {url:direct, label:"Zusammenfassung ansehen", direct:true};
  const q = encodeURIComponent(`${m.team1.teamName} ${m.team2.teamName} Highlights`);
  return {url:`https://www.youtube.com/results?search_query=${q}`, label:"Highlights bei YouTube suchen", direct:false};
}

function broadcastHtml(m) {
  const matchId = String(m.matchID);
  const direct = BROADCASTS[matchId];

  if (direct) {
    return `
      <div class="broadcast">
        <div class="broadcast-head">
          📺 ${esc(direct.name)}
          <span class="badge green">${esc(direct.type || "Live")}</span>
        </div>
        <small>Für dieses Spiel hinterlegte Übertragung.</small>
        <br>
        <a class="direct" href="${esc(direct.url)}" target="_blank" rel="noopener">Zum Anbieter →</a>
      </div>
    `;
  }

  const regional = REGIONAL_SOURCES[state.league];

  if (regional) {
    if (state.league === "rl-bayern") {
      return `
        <div class="broadcast">
          <div class="broadcast-head">📺 Regionalliga Bayern</div>
          <small>Offizielle Ergebnis- und Ligainformationen über den BFV. Spielberichte und Tore gibt es über BFV.TV. Das jeweilige Top-Spiel kann zusätzlich live bei BR24Sport bzw. in der ARD-Mediathek laufen.</small>
          <div class="badges">
            <span class="badge green">🟢 BFV</span>
            <span class="badge">🎥 BFV.TV</span>
            <span class="badge gold">⭐ BR24Sport / ARD-Mediathek</span>
          </div>
          <a href="${regional.url}" target="_blank" rel="noopener">BFV öffnen →</a>
          <a href="${regional.video}" target="_blank" rel="noopener">BFV.TV →</a>
        </div>
      `;
    }

    return `
      <div class="broadcast">
        <div class="broadcast-head">📺 Übertragung / Ergebnisquelle</div>
        <small>Für dieses Spiel wurde noch kein konkreter Live-Sender hinterlegt.</small>
        <br>
        <a href="${regional.url}" target="_blank" rel="noopener">${esc(regional.name)} öffnen →</a>
      </div>
    `;
  }

  return `
    <div class="broadcast">
      <div class="broadcast-head">📺 Wo kann ich das Spiel schauen?</div>
      <small>Für dieses Spiel ist momentan keine bestätigte Übertragung hinterlegt.</small>
    </div>
  `;
}

function buildAnalysis(m, stats, res) {

  // Wenn echte Statistikdaten vorhanden sind
  if (stats && stats.note) {

    return `
      <div class="analysis">
        <div class="analysis-title">
          🧠 Kurz-Analyse
        </div>

        <p>${esc(stats.note)}</p>

        ${
          stats.possession
          ? `
          <div class="possession">

            <div class="pos">
              <strong>${stats.possession[0]}%</strong>
              <div>${esc(m.team1.teamName)}</div>

              <div class="bar">
                <div
                  class="fill"
                  style="width:${stats.possession[0]}%">
                </div>
              </div>
            </div>

            <div class="pos">
              <strong>${stats.possession[1]}%</strong>
              <div>${esc(m.team2.teamName)}</div>

              <div class="bar">
                <div
                  class="fill"
                  style="width:${stats.possession[1]}%">
                </div>
              </div>
            </div>

          </div>

          <p class="muted">
            Mehr Ballbesitz:
            <strong>
              ${
                stats.possession[0] > stats.possession[1]
                  ? esc(m.team1.teamName)
                  : stats.possession[1] > stats.possession[0]
                    ? esc(m.team2.teamName)
                    : "beide Mannschaften gleich"
              }
            </strong>
          </p>
          `
          : ""
        }

        ${
          stats.shots || stats.shotsOnTarget || stats.xg
          ? `
          <div class="stat-grid">

            ${
              stats.shots
              ? `
              <div class="stat">
                <b>${stats.shots[0]} : ${stats.shots[1]}</b>
                <span>Schüsse</span>
              </div>
              `
              : ""
            }

            ${
              stats.shotsOnTarget
              ? `
              <div class="stat">
                <b>${stats.shotsOnTarget[0]} : ${stats.shotsOnTarget[1]}</b>
                <span>Schüsse aufs Tor</span>
              </div>
              `
              : ""
            }

            ${
              stats.xg
              ? `
              <div class="stat">
                <b>${stats.xg[0]} : ${stats.xg[1]}</b>
                <span>xG</span>
              </div>
              `
              : ""
            }

          </div>
          `
          : ""
        }

      </div>
    `;
  }

  // Keine Statistik vorhanden → nichts erfinden
  if (!res) {
    return `
      <div class="analysis">
        <div class="analysis-title">
          🧠 Spielanalyse
        </div>

        <p>
          Das Spiel läuft bzw. hat noch nicht begonnen.
          Eine vollständige Analyse folgt nach dem Spiel.
        </p>
      </div>
    `;
  }

  return `
    <div class="analysis">

      <div class="analysis-title">
        🧠 Kurz-Analyse
      </div>

      <p>
        ${
          res.a > res.b
          ? `${esc(m.team1.teamName)} gewann das Spiel mit ${res.a}:${res.b} und setzte sich am Ende verdient durch die bessere Energie und Effektivität im Abschluss durch.`
          : res.b > res.a
            ? `${esc(m.team2.teamName)} entschied das Duell mit ${res.b}:${res.a} für sich und war in entscheidenden Momenten effizienter und kompakter.`
            : `Das Spiel endete ${res.a}:${res.b}. Beide Teams blieben in der zweiten Halbzeit ausgeglichen und es war vor allem die kleine Entscheidung in der letzten Phase, die die Partie prägte.`
        }
      </p>

      <p class="muted">
        ℹ️ Für dieses Spiel sind momentan keine zuverlässigen
        Ballbesitz- und Schussstatistiken verfügbar. Die Einschätzung
        basiert daher auf Spielverlauf, Chancenlage und Ergebnisentwicklung.
      </p>

    </div>
  `;
}

async function showTable(){
  setStatus("Lade Tabelle …");
  try{
    const rows = await api(`/getbltable/${state.league}/${SEASON}`);
    if(!rows.length) return setStatus("Für diese Liga liegen noch keine Tabellendaten vor.");
    const z = ZONES[state.league];
    const body = rows.map((t, i) => {
      let cls = "";
      if(z && i < z.up) cls = "zone-up";
      if(z && i >= rows.length - z.down) cls = "zone-down";
      return `<tr class="${cls}">
        <td class="rank">${i + 1}</td>
        <td class="team">${t.teamIconUrl ? `<img class="logo" src="${esc(t.teamIconUrl)}" alt="" loading="lazy" width="22" height="22">` : ""}<span>${esc(t.teamName)}</span></td>
        <td>${t.matches}</td>
        <td class="hide-s">${t.won}-${t.draw}-${t.lost}</td>
        <td>${t.goalDiff > 0 ? "+" : ""}${t.goalDiff}</td>
        <td class="pts">${t.points}</td>
      </tr>`;
    }).join("");
    content.innerHTML = `<div class="table-wrap"><table class="standings">
      <thead><tr><th>#</th><th class="team">Verein</th><th>Sp</th><th class="hide-s">S-U-N</th><th>Diff</th><th>Pkt</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
  }catch(e){
    setStatus("Tabelle konnte nicht geladen werden. Liga-Kürzel prüfen oder später erneut versuchen.", true);
  }
}

function matchCard(m){
  const res = finalResult(m);
  const live = !m.matchIsFinished && res;
  const score = res ? `${res.a}:${res.b}` : (m.matchDateTime ? new Date(m.matchDateTime).toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"}) : "–");
  const goals = (m.goals || []).slice().sort((a, b) => a.matchMinute - b.matchMinute);
  const ht = halfTime(m);
  const v = videoLink(m);
  const stats = MATCH_STATS[String(m.matchID)];
  const goalList = goals.length
  ? `
    <ol class="goals">

      ${goals.map(g => `
        <li>

          <span class="goal-icon">⚽</span>

          <span class="min">
            ${g.matchMinute ?? "?"}'
          </span>

          <span class="gs">
            ${g.scoreTeam1}:${g.scoreTeam2}
          </span>

          <span>
            <strong>
              ${esc(g.goalGetterName || "Torschütze unbekannt")}
            </strong>

            ${g.isPenalty ? " · Elfmeter" : ""}
            ${g.isOwnGoal ? " · Eigentor" : ""}
          </span>

        </li>
      `).join("")}

    </ol>
  `
  : `
    <p class="muted">
      ${m.matchIsFinished
        ? "Keine Torinformationen vorhanden."
        : "Noch keine Tore."}
    </p>
  `;
  return `<details class="match ${live ? "live" : ""}">
    <summary>
      <span class="side home">${esc(m.team1.shortName || m.team1.teamName)}${logo(m.team1)}</span>
      <span class="score">${score}</span>
      <span class="side away">${logo(m.team2)}${esc(m.team2.shortName || m.team2.teamName)}</span>
    </summary>
    <div class="detail">
      <p class="meta">${esc(fmtDate(m.matchDateTime))}${m.location && m.location.locationCity ? " · " + esc(m.location.locationCity) : ""}${ht ? " · Halbzeit " + ht : ""}${m.numberOfViewers ? " · " + m.numberOfViewers.toLocaleString("de-DE") + " Zuschauer" : ""}</p>
      ${goalList}
      ${buildAnalysis(m, stats, res)}
      ${m.matchIsFinished ? `<a class="video ${v.direct ? "direct" : ""}" href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.label)}</a>` : ""}
      ${broadcastHtml(m)}
    </div>
  </details>`;
}

async function showMatches(){
  setStatus("Lade Spieltag …");
  try{
    if(state.day == null){
      try{ const g = await api(`/getcurrentgroup/${state.league}`); state.day = g.groupOrderID || 1; }
      catch{ state.day = 1; }
    }
    $("#dayLabel").textContent = `${state.day}. Spieltag`;
    const matches = await api(`/getmatchdata/${state.league}/${SEASON}/${state.day}`);
    if(!matches.length) return setStatus("Für diesen Spieltag gibt es keine Spiele.");
    matches.sort((a, b) => new Date(a.matchDateTime) - new Date(b.matchDateTime));
    const byDay = {};
    matches.forEach(m => {
      const key = m.matchDateTime
        ? new Date(m.matchDateTime).toLocaleDateString("de-DE", {weekday:"long", day:"2-digit", month:"long"})
        : "Termin offen";
      (byDay[key] = byDay[key] || []).push(m);
    });
    content.innerHTML = Object.entries(byDay)
      .map(([d, list]) => `<section><h2>${esc(d)}</h2>${list.map(matchCard).join("")}</section>`).join("");
  }catch(e){
    setStatus("Spiele konnten nicht geladen werden. Liga-Kürzel prüfen oder später erneut versuchen.", true);
  }
}

function render(){
  $("#mdnav").hidden = state.view !== "matches";
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === state.view)));
  state.view === "table" ? showTable() : showMatches();
}

function buildLeagueNav(){
  $("#leagues").innerHTML = LEAGUES.map(l => `<button data-id="${esc(l.id)}" aria-pressed="${l.id === state.league}">${esc(l.name)}</button>`).join("");
}

$("#leagues").addEventListener("click", e => {
  const b = e.target.closest("button");
  if(!b) return;
  state.league = b.dataset.id;
  state.day = null;
  buildLeagueNav();
  render();
});

document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if(!b) return;
  state.view = b.dataset.view;
  render();
});

$("#prev").addEventListener("click", () => { if(state.day > 1){ state.day--; showMatches(); } });
$("#next").addEventListener("click", () => { state.day++; showMatches(); });

$("#season").textContent = `Saison ${SEASON}/${String(SEASON + 1).slice(2)}`;
buildLeagueNav();
render();
</script>
</body>
</html>
