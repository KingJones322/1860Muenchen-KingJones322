<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fußball-Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0e9;--surface:#fffdf8;--surface2:#f7f3e9;--ink:#192536;--muted:#68717d;--line:#ded8ca;--accent:#b08a45;--accent2:#d1b578;--accent-ink:#192536;--live:#b23a36;--up:#39765a;--down:#b23a36;--gold:#a9823f;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#111923;--surface:#1a2634;--surface2:#202f40;--ink:#f3efe5;--muted:#aab4c0;--line:#344253;--accent:#d0ad68;--accent2:#e0c58d;--accent-ink:#172130;--live:#f07870;--up:#78b698;--down:#f07870;--gold:#dfbf7c}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0 auto;background:var(--bg);color:var(--ink);font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:17px;line-height:1.5;max-width:1120px;padding-bottom:2rem}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:1rem 1rem .5rem}
.top h1{margin:0;font-size:1.6rem;font-weight:700;display:flex;align-items:center;gap:.45rem}
.top h1::before{content:"🏆";font-size:1.1rem;filter:drop-shadow(0 2px 4px rgba(176,138,69,.3))}
.season{margin:0;color:var(--muted);font-size:.95rem}
.leagues{display:flex;gap:.5rem;overflow-x:auto;padding:.5rem 1rem;scrollbar-width:none}
.leagues::-webkit-scrollbar{display:none}
.leagues button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.4rem .9rem;border-radius:999px;font:inherit;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;box-shadow:0 2px 8px rgba(25,37,54,.06)}
.leagues button::before{content:"⚽";font-size:.8rem;opacity:.9}
.leagues button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--accent)}
.leagues button[data-sport="basketball"]::before{content:"🏀"}
.news{margin:.65rem 1rem 1rem;padding:1rem;background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(25,37,54,.06)}
.news-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.7rem}
.news-head h2{margin:0;font-size:1.2rem}
.news-head span,.news-meta{color:var(--muted);font-size:.85rem}
.news-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.6rem}
.news-item{min-width:0;padding:.7rem .8rem;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0}
.news-item a{font-weight:700;color:var(--ink);text-decoration:none}
.news-item a:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.news-meta{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.35rem}
.news-meta span+time::before{content:"·";margin-right:.4rem}
.news-error{color:var(--live)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:.25rem 1rem 0}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:.7rem 0;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.tabs button::before{font-size:.9rem}
.tabs button[data-view="table"]::before{content:"📊"}
.tabs button[data-view="matches"]::before{content:"📅"}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mdnav{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem}
.mdnav[hidden]{display:none}
.mdnav button{width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.4rem;line-height:1;cursor:pointer}
main{padding:.5rem 1rem}
.status{color:var(--muted);padding:1.5rem 0;text-align:center}
.status.error{color:var(--live)}
.data-note{padding:.5rem .7rem;background:var(--surface2);border-left:3px solid var(--accent);color:var(--muted);font-size:.9rem}
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto;box-shadow:0 8px 24px rgba(25,37,54,.06)}
.standings{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.standings th,.standings td{padding:.55rem .5rem;text-align:center;border-bottom:1px solid var(--line)}
.standings thead th{color:var(--muted);font-weight:500;font-size:.9rem}
.standings tbody tr:last-child td{border-bottom:0}
.standings .team{text-align:left}
.standings td.team{display:flex;align-items:center;gap:.6rem}
.standings .pts{font-weight:700}
.standings .rank{font-weight:600;border-left:4px solid transparent}
.zone-up .rank{border-left-color:var(--up)}
.zone-down .rank{border-left-color:var(--down)}
.club-link{display:inline-flex;align-items:center;gap:.55rem;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:.1rem;border-radius:6px}
.club-link:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.standings .club-link{font-weight:600}
@media(max-width:420px){.hide-s{display:none}}
.logo{width:24px;height:24px;object-fit:contain;flex:0 0 auto;display:inline-block}
.club-page{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;box-shadow:0 8px 22px rgba(25,37,54,.07)}
.club-back{border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);padding:.45rem .7rem;font:inherit;font-weight:600;cursor:pointer}
.club-heading{display:flex;align-items:center;gap:.75rem;margin:1rem 0}
.club-heading img{width:52px;height:52px;object-fit:contain}
.club-heading h2{margin:0;font-size:1.5rem}
.club-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:.5rem;margin:.8rem 0}
.club-fact,.player-card{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:.65rem}
.club-fact strong,.club-fact span{display:block}
.club-fact span,.player-meta{color:var(--muted);font-size:.88rem}
.club-description{white-space:pre-line}
.player-group>h3{font-size:.95rem;font-weight:600;color:var(--muted);margin:1rem 0 .4rem}
.player-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.55rem}
.player-card{display:flex;align-items:flex-start;gap:.65rem}
.player-card img{width:48px;height:48px;object-fit:cover;border-radius:50%;background:var(--line)}
.player-card h3{margin:0;font-size:1rem}
.player-card p{margin:.25rem 0}
.club-source{font-size:.85rem;color:var(--muted)}
.club-source a{color:inherit}
.club-warning{border-left:3px solid var(--accent);padding:.5rem .7rem;background:var(--surface2);font-size:.9rem}
.club-error{color:var(--live)}
.coach-card{padding:.7rem .8rem;background:var(--surface2);border:1px solid var(--line);border-radius:9px}
.coach-card strong{font-size:1.05rem}
section h2{font-size:.95rem;font-weight:600;color:var(--muted);margin:1.2rem 0 .4rem}
.match{background:linear-gradient(145deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:14px;margin-bottom:.65rem;box-shadow:0 8px 22px rgba(25,37,54,.07)}
.match summary{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.5rem;padding:.75rem;cursor:pointer;list-style:none}
.match-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.5rem;padding:.75rem}
.match summary::-webkit-details-marker{display:none}
.side{display:flex;align-items:center;gap:.5rem;font-weight:500}
.side.home{justify-content:flex-end;text-align:right}
.score{font-weight:700;font-size:1.15rem;min-width:3.4rem;text-align:center;font-variant-numeric:tabular-nums}
.match.live .score{color:var(--live)}
.detail{padding:0 .75rem .85rem;border-top:1px solid var(--line)}
.meta{color:var(--muted);font-size:.9rem;margin:.6rem 0}
.goals{list-style:none;padding:0;margin:0 0 .75rem}
.goals li{display:flex;gap:.6rem;padding:.2rem 0}
.goals .min{width:2.4rem;color:var(--muted);text-align:right}
.goals .gs{font-weight:600;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.analysis{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:1rem;margin:.85rem 0;box-shadow:0 5px 16px rgba(25,37,54,.05)}
.analysis-title{font-weight:800;font-size:1.05rem;margin-bottom:.4rem}
.analysis p{margin:.45rem 0}
.analysis .description-lead{font-size:1.02rem}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin-top:.7rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.65rem .4rem;text-align:center}
.stat b{display:block;font-size:1.1rem}
.stat span{display:block;color:var(--muted);font-size:.78rem}
.possession{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.7rem}
.pos{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.65rem;text-align:center}
.pos strong{font-size:1.3rem}
.bar{height:7px;background:var(--line);border-radius:99px;margin-top:.45rem;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.video{display:inline-block;padding:.5rem .9rem;border-radius:7px;text-decoration:none;font-weight:600;border:1px solid var(--accent);color:var(--ink);box-shadow:0 4px 10px rgba(25,37,54,.08)}
.video.direct{background:var(--ink);color:var(--accent)}
.broadcast{margin:.85rem 0;padding:1rem;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 38%,var(--line));box-shadow:0 6px 18px rgba(25,37,54,.06)}
.broadcast-head{font-weight:800;display:flex;align-items:center;gap:.4rem}
.broadcast-head::before{content:"📺";font-size:1rem}
.broadcast p{margin:.35rem 0 0;color:var(--muted);font-size:.92rem}
.channel-list{display:flex;gap:.4rem;flex-wrap:wrap;margin:.65rem 0 .2rem}
.channel{display:inline-flex;align-items:center;border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:999px;background:var(--surface);padding:.3rem .7rem;font-size:.85rem;font-weight:700;letter-spacing:.02em}
.badges{display:flex;gap:.35rem;flex-wrap:wrap;margin:.5rem 0}
.badge{display:inline-flex;align-items:center;gap:.25rem;border-radius:999px;padding:.22rem .55rem;font-size:.78rem;font-weight:700;background:var(--surface);border:1px solid var(--line)}
.badge.green{border-color:#45b77c;color:var(--up)}
.badge.gold{border-color:var(--gold);color:var(--gold)}
.goal-icon{font-size:1rem}
footer{color:var(--muted);font-size:.85rem;padding:1.5rem 1rem 0}
footer a{color:inherit}
</style>
</head>
<body>
<header class="top"><h1>Sport-Hub</h1><p class="season" id="season"></p></header>
<nav class="leagues" id="leagues" aria-label="Liga wählen"></nav>
<section class="news" id="news" aria-live="polite" aria-label="Aktuelle Nachrichten"></section>
<nav class="tabs" role="tablist">
  <button role="tab" data-view="matches" aria-selected="true">Spieltag</button>
  <button role="tab" data-view="table" aria-selected="false">Tabelle</button>
</nav>
<div class="mdnav" id="mdnav" hidden>
  <button id="prev" aria-label="Vorheriger Spieltag">‹</button>
  <strong id="dayLabel"></strong>
  <button id="next" aria-label="Nächster Spieltag">›</button>
</div>
<main id="content" aria-live="polite"></main>
<footer>Spiel- und Tabellendaten: <a href="https://www.openligadb.de" target="_blank" rel="noopener">OpenLigaDB</a>, <a href="https://www.thesportsdb.com" target="_blank" rel="noopener">TheSportsDB</a> und ESPN · Nachrichten: <a href="https://news.google.com" target="_blank" rel="noopener">Google News</a></footer>

<script>
"use strict";

const API_BASE = "https://api.openligadb.de";
const SPORTSDB_BASE = "https://www.thesportsdb.com/api/v1/json/3";

// Regionalliga-Kürzel bitte auf openligadb.de prüfen und ggf. anpassen
const LEAGUES = [
  {id:"bl1", name:"Bundesliga", sport:"football", provider:"openligadb", search:"Bundesliga"},
  {id:"bl2", name:"2. Bundesliga", sport:"football", provider:"openligadb", search:"2. Bundesliga"},
  {id:"bl3", name:"3. Liga", sport:"football", provider:"openligadb", search:"3. Liga"},
  {id:"pl", name:"Premier League", sport:"football", provider:"openligadb", search:"Premier League"},
  {id:"es1", name:"La Liga", sport:"football", provider:"sportsdb", leagueId:"4335", search:"La Liga Spanien"},
  {id:"fr1", name:"Ligue 1", sport:"football", provider:"sportsdb", leagueId:"4334", search:"Ligue 1 Frankreich"},
  {id:"ucl", name:"Champions League", sport:"football", provider:"openligadb", search:"UEFA Champions League"},
  {id:"nba", name:"NBA", sport:"basketball", provider:"espn", search:"NBA Basketball"},
  {id:"rl-nord", name:"Regionalliga Nord", sport:"football", provider:"openligadb", search:"Regionalliga Nord"},
  {id:"rl-nordost", name:"Regionalliga Nordost", sport:"football", provider:"openligadb", search:"Regionalliga Nordost"},
  {id:"rl-west", name:"Regionalliga West", sport:"football", provider:"openligadb", search:"Regionalliga West"},
  {id:"rl-suedwest", name:"Regionalliga Südwest", sport:"football", provider:"openligadb", search:"Regionalliga Südwest"},
  {id:"rl-bayern", name:"Regionalliga Bayern", sport:"football", provider:"openligadb", search:"Regionalliga Bayern"}
];

const ZONES = {bl1:{up:4,down:2}, bl2:{up:2,down:3}, bl3:{up:2,down:4}};

// Eigene Videolinks: "matchID": "https://..."
const VIDEOS = {
  // "68123": "https://www.youtube.com/watch?v=XXXXXXXXXXX"
};

// Zusätzliche echte Spieldaten.
const MATCH_STATS = {
  /*
  "123456": {
    possession: [61, 39],
    shots: [15, 7],
    shotsOnTarget: [8, 3],
    xg: [2.10, 0.72],
    note: "Dortmund war über weite Strecken spielbestimmend und hatte deutlich mehr Ballbesitz."
  }
  */
};

// Sendernamen je Spiel hinterlegen; hier bewusst keine Anbieter-Links eintragen.
const BROADCASTS = {
  /*
  "123456": {
    channels: ["SPORT1"],
    type: "Live im Free-TV"
  }
  */
};

const BROADCAST_GUIDANCE = {
  bl1: "In der Bundesliga verteilen sich die Live-Spiele je nach Anstoßzeit und Begegnung auf Sky und DAZN. Einzelne Partien können zusätzlich frei empfangbar sein.",
  bl2: "Die Live-Spiele der 2. Bundesliga laufen üblicherweise bei Sky. Eine spielbezogene Bestätigung liegt für diese Begegnung nicht vor.",
  bl3: "Die 3. Liga wird live bei MagentaSport gezeigt; ausgewählte Begegnungen laufen zusätzlich bei den ARD-Regionalsendern.",
  "rl-bayern": "Bei ausgewählten Spielen der Regionalliga Bayern gibt es Live-Übertragungen im BR-Programm. BFV.TV zeigt Spielberichte und Highlights.",
  "rl-nord": "Für die Regionalliga Nord sind die Übertragungsmöglichkeiten je nach Verein und Spiel unterschiedlich.",
  "rl-nordost": "Für die Regionalliga Nordost sind die Übertragungsmöglichkeiten je nach Verein und Spiel unterschiedlich.",
  "rl-west": "Für die Regionalliga West sind die Übertragungsmöglichkeiten je nach Verein und Spiel unterschiedlich.",
  "rl-suedwest": "Für die Regionalliga Südwest sind die Übertragungsmöglichkeiten je nach Verein und Spiel unterschiedlich."
};

const SEASON = (() => { const d = new Date(); return d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1; })();

const state = {league: LEAGUES[0].id, view: "matches", day: null, club: null};
const $ = s => document.querySelector(s);
const content = $("#content");
const clubCache = new Map();
const espnTeamCache = new Map();
const newsCache = new Map();
let clubRequest = 0;
let newsRequest = 0;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path){
  const r = await fetch(API_BASE + path);
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function sportsDb(path){
  const r = await fetch(`${SPORTSDB_BASE}/${path}`);
  if(!r.ok) throw new Error(`TheSportsDB HTTP ${r.status}`);
  return r.json();
}

async function espn(path){
  const r = await fetch(`https://site.api.espn.com/apis/site/v2/${path}`);
  if(!r.ok) throw new Error(`ESPN HTTP ${r.status}`);
  return r.json();
}

async function wikidata(path){
  const r = await fetch(`https://www.wikidata.org/w/api.php?${path}&origin=*`);
  if(!r.ok) throw new Error(`Wikidata HTTP ${r.status}`);
  return r.json();
}

function setStatus(msg, err = false){
  content.innerHTML = `<p class="status ${err ? "error" : ""}">${esc(msg)}</p>`;
}

function renderNews(items, loading = false, error = ""){
  const league = LEAGUES.find(item => item.id === state.league);
  const articles = items.map(item => {
    const url = safeWebsiteUrl(item.link);
    const date = item.pubDate && !Number.isNaN(Date.parse(item.pubDate))
      ? new Date(item.pubDate).toLocaleString("de-DE", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"})
      : "";
    return `<article class="news-item">
      ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(item.title || "Nachricht öffnen")}</a>` : `<strong>${esc(item.title || "Nachricht")}</strong>`}
      <div class="news-meta">${item.author ? `<span>${esc(item.author)}</span>` : ""}${date ? `<time datetime="${esc(item.pubDate)}">${esc(date)}</time>` : ""}</div>
    </article>`;
  }).join("");
  $("#news").innerHTML = `<div class="news-head"><h2>Aktuelle Nachrichten · ${esc(league.name)}</h2><span>${loading ? "Nachrichten werden geladen …" : "Google News · zuletzt aktualisiert"}</span></div>
    ${error ? `<p class="news-error">${esc(error)} <button type="button" data-news-retry>Erneut laden</button></p>` : ""}
    ${articles ? `<div class="news-grid">${articles}</div>` : !loading && !error ? `<p class="muted">Für diese Liga sind aktuell keine Meldungen verfügbar.</p>` : ""}`;
}

async function loadNews(){
  const request = ++newsRequest;
  const league = LEAGUES.find(item => item.id === state.league);
  const cached = newsCache.get(league.id);
  if(cached){
    renderNews(cached);
    return;
  }
  renderNews([], true);
  try{
    const query = new URLSearchParams({q:`${league.search} when:7d`,hl:"de",gl:"DE",ceid:"DE:de"});
    const feed = `https://news.google.com/rss/search?${query}`;
    const endpoint = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed)}`;
    const response = await fetch(endpoint);
    if(!response.ok) throw new Error(`Nachrichtenquelle HTTP ${response.status}`);
    const data = await response.json();
    if(data.status !== "ok") throw new Error(data.message || "Die Nachrichtenquelle hat einen Fehler gemeldet.");
    const items = (data.items || []).slice().sort((a, b) => Date.parse(b.pubDate || 0) - Date.parse(a.pubDate || 0)).slice(0, 6);
    newsCache.set(league.id, items);
    if(request === newsRequest && state.league === league.id) renderNews(items);
  }catch(error){
    if(request === newsRequest && state.league === league.id) renderNews([], false, `Nachrichten konnten nicht geladen werden: ${error.message}`);
  }
}

const logo = t => t.teamIconUrl ? `<img class="logo" src="${esc(t.teamIconUrl)}" alt="" loading="lazy" width="24" height="24">` : `<span class="logo"></span>`;

function clubButton(team, side = ""){
  return `<button class="club-link ${side}" type="button" data-team-name="${esc(team.teamName)}" aria-label="Vereinsprofil: ${esc(team.teamName)}">${logo(team)}<span>${esc(team.teamName)}</span></button>`;
}

function safeImageUrl(value){
  try{
    const url = new URL(value);
    return url.protocol === "https:" ? url.href : "";
  }catch{
    return "";
  }
}

function safeWebsiteUrl(value){
  if(!value) return "";
  const address = /^https?:\/\//i.test(value) ? value : `https://${value}`;
  try{
    const url = new URL(address);
    return url.protocol === "https:" || url.protocol === "http:" ? url.href : "";
  }catch{
    return "";
  }
}

function teamMatchesName(team, name){
  const normalize = value => String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const sought = normalize(name);
  const names = [team.strTeam, ...(team.strTeamAlternate || "").split(",")];
  return names.some(candidate => normalize(candidate) === sought);
}

function ageFromDate(date){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date || "")) return null;
  const born = new Date(`${date}T00:00:00Z`);
  if(Number.isNaN(born.getTime())) return null;
  const now = new Date();
  let age = now.getUTCFullYear() - born.getUTCFullYear();
  if(now.getUTCMonth() < born.getUTCMonth() || (now.getUTCMonth() === born.getUTCMonth() && now.getUTCDate() < born.getUTCDate())) age--;
  return age >= 0 ? age : null;
}

function clubFact(label, value){
  return value ? `<div class="club-fact"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>` : "";
}

function playerPositionGroup(position){
  const normalized = String(position || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  if(/\b(goalkeeper|goal keeper|keeper|torwart|torhuter|torhueter)\b/.test(normalized)) return "Torhüter";
  if(/\b(defender|defence|defense|def|back|verteidiger|abwehr)\b/.test(normalized)) return "Verteidigung";
  if(/\b(midfielder|midfield|mid|mittelfeld)\b/.test(normalized)) return "Mittelfeld";
  if(/\b(forward|striker|attacker|winger|sturm|sturmer|stuermer|angreifer)\b/.test(normalized)) return "Sturm";
  return "Weitere Spieler";
}

function playerCard(player){
  const age = ageFromDate(player.dateBorn);
  const facts = [
    player.strPosition,
    age == null ? "" : `${age} Jahre`,
    player.strHeight,
    player.strNationality,
    player.strNumber ? `Nr. ${player.strNumber}` : ""
  ].filter(Boolean);
  const description = player.strDescriptionDE || player.strDescriptionEN;
  const photo = safeImageUrl(player.strThumb || player.strCutout);
  return `<article class="player-card">
    ${photo ? `<img src="${esc(photo)}" alt="" loading="lazy">` : ""}
    <div><h3>${esc(player.strPlayer || "Spielername nicht angegeben")}</h3>
      ${facts.length ? `<p class="player-meta">${esc(facts.join(" · "))}</p>` : ""}
      ${description ? `<details><summary>Profil und bisherige Vereine</summary><p>${esc(description)}</p></details>` : ""}
    </div>
  </article>`;
}

function espnRosterLeague(league){
  const normalized = String(league || "").toLowerCase();
  if(normalized.includes("german bundesliga")) return "ger.1";
  if(normalized.includes("2. bundesliga") || normalized.includes("2nd bundesliga")) return "ger.2";
  if(normalized === "english premier league" || normalized === "premier league england") return "eng.1";
  if(normalized.includes("spanish la liga")) return "esp.1";
  if(normalized.includes("french ligue 1")) return "fra.1";
  if(normalized.includes("italian serie a")) return "ita.1";
  if(normalized.includes("champions league")) return "uefa.champions";
  return null;
}

function normalizePersonOrTeam(value){
  return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
}

function espnTeamMatches(candidate, team){
  const sought = new Set([team.strTeam, ...(team.strTeamAlternate || "").split(",")].map(normalizePersonOrTeam));
  const names = [candidate.displayName, candidate.name, candidate.location, candidate.shortDisplayName];
  return names.some(candidate => sought.has(normalizePersonOrTeam(candidate)));
}

async function currentEspnRoster(team){
  const league = espnRosterLeague(team.strLeague);
  if(!league) return null;
  let teamsPromise = espnTeamCache.get(league);
  if(!teamsPromise){
    teamsPromise = espn(`sports/soccer/${league}/teams?limit=100`).then(data =>
      (data.sports || []).flatMap(sport =>
        (sport.leagues || []).flatMap(item => (item.teams || []).map(entry => entry.team))
      )
    );
    espnTeamCache.set(league, teamsPromise);
  }
  const teams = await teamsPromise;
  const espnTeam = teams.find(candidate => espnTeamMatches(candidate, team));
  if(!espnTeam) return null;
  const roster = await espn(`sports/soccer/${league}/teams/${encodeURIComponent(espnTeam.id)}/roster`);
  if(roster.status !== "success" || Number(roster.season?.year) !== SEASON) return null;
  return (roster.athletes || []).filter(player => player.fullName).map(player => ({
    strPlayer: player.fullName,
    strPosition: player.position?.displayName || "",
    dateBorn: player.dateOfBirth ? player.dateOfBirth.slice(0, 10) : "",
    strHeight: player.displayHeight || "",
    strNationality: player.citizenshipCountry || "",
    strNumber: player.jersey || ""
  }));
}

async function currentWikidataCoaches(team){
  const search = new URLSearchParams({
    action:"wbsearchentities",
    search:team.strTeam,
    language:"en",
    format:"json"
  });
  const results = await wikidata(search.toString());
  const soughtNames = new Set([team.strTeam, ...(team.strTeamAlternate || "").split(",")].map(normalizePersonOrTeam));
  const club = (results.search || []).find(item => soughtNames.has(normalizePersonOrTeam(item.label)));
  if(!club) return null;

  const entityResponse = await fetch(`https://www.wikidata.org/wiki/Special:EntityData/${encodeURIComponent(club.id)}.json`);
  if(!entityResponse.ok) throw new Error(`Wikidata entity HTTP ${entityResponse.status}`);
  const entityData = await entityResponse.json();
  const claims = entityData.entities?.[club.id]?.claims?.P286 || [];
  const now = Date.now();
  const currentClaims = claims.filter(claim => {
    if(claim.rank === "deprecated") return false;
    const end = claim.qualifiers?.P582?.[0]?.datavalue?.value?.time;
    if(claim.qualifiers?.P582?.length && (!end || Date.parse(end.slice(1, 11)) <= now)) return false;
    const start = claim.qualifiers?.P580?.[0]?.datavalue?.value?.time;
    return !start || Date.parse(start.slice(1, 11)) <= now;
  });
  const coachIds = [...new Set(currentClaims.map(claim => claim.mainsnak?.datavalue?.value?.id).filter(Boolean))];
  if(!coachIds.length) return {names:[], url:`https://www.wikidata.org/wiki/${encodeURIComponent(club.id)}`};

  const labelsQuery = new URLSearchParams({
    action:"wbgetentities",
    ids:coachIds.join("|"),
    props:"labels",
    languages:"en|de",
    format:"json"
  });
  const labels = await wikidata(labelsQuery.toString());
  return {
    names:coachIds.map(id => {
      const entity = labels.entities?.[id];
      return entity?.labels?.en?.value || entity?.labels?.de?.value || "";
    }).filter(Boolean),
    url:`https://www.wikidata.org/wiki/${encodeURIComponent(club.id)}`
  };
}

function playerGroups(players){
  const order = ["Torhüter", "Verteidigung", "Mittelfeld", "Sturm", "Weitere Spieler"];
  const groups = new Map(order.map(label => [label, []]));
  players.forEach(player => groups.get(playerPositionGroup(player.strPosition)).push(player));
  return order
    .filter(label => groups.get(label).length)
    .map(label => `<section class="player-group"><h3>${label}</h3><div class="player-grid">${groups.get(label).map(playerCard).join("")}</div></section>`)
    .join("");
}

async function showClub(name){

      data = {team, players: null, playerError: null, coaches: null, coachError: null, rosterSource: null, rosterNotice: null};
      if(team){
        const [rosterResult, coachResult] = await Promise.allSettled([
          (async() => {
            let espnError = null;
            const currentRoster = await currentEspnRoster(team).catch(error => {
              espnError = error;
              return null;
            });
            if(currentRoster?.length) return {players:currentRoster, source:"ESPN · Saisonkader"};

              if(espnError) throw new Error(`ESPN: ${espnError.message}; TheSportsDB: ${error.message}`);

            }

              player.strSport === "Soccer" &&

          })(),

          data.players = rosterResult.value.players;
          data.rosterSource = rosterResult.value.source;

      clubFact("Ort", team.strLocation),

    ].join("");

      : data.players.length

function finalResult(m){
  const rs = m.matchResults || [];
  const r = rs.find(x => x.resultTypeID === 2) || rs.slice(-1)[0];
  return r ? {a:r.pointsTeam1, b:r.pointsTeam2} : null;
}

function halfTime(m){
  const r = (m.matchResults || []).find(x => x.resultTypeID === 1);
  return r ? `${r.pointsTeam1}:${r.pointsTeam2}` : null;
}

function fmtDate(iso){
  if(!iso) return "Termin offen";
  return new Date(iso).toLocaleString("de-DE", {weekday:"short", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
}

function videoLink(m){
  const direct = VIDEOS[String(m.matchID)];

function buildAnalysis(m, stats, res) {
  if (!res) {
    const league = LEAGUES.find(item => item.id === state.league)?.name || "Ligawettbewerb";
    const venue = m.location && m.location.locationCity ? esc(m.location.locationCity) : null;
    const schedule = fmtDate(m.matchDateTime);
    const previewNote = stats && stats.note ? `<p>${esc(stats.note)}</p>` : "";
    return `
      <div class="analysis">
        <div class="analysis-title">Ausführliche Spielvorschau</div>
        <p class="description-lead"><strong>${esc(m.team1.teamName)} gegen ${esc(m.team2.teamName)}</strong> – das Duell gehört zum ${esc(league)}-Spieltag. Anstoß ist laut Spielplan am ${esc(schedule)}${venue ? ` in ${venue}` : ""}.</p>
        <p>Vor dem Anpfiff stehen zunächst die grundlegenden Fragen im Mittelpunkt: Welche Mannschaft findet schneller in ihren Rhythmus? Wem gelingt es, die eigenen Angriffe sauber bis in gefährliche Räume zu tragen, und welches Team kann gegnerische Vorstöße früh unterbrechen? Die Antworten darauf werden sich erst im tatsächlichen Spielverlauf zeigen; aus den vorliegenden Angaben lässt sich keine verlässliche Prognose ableiten.</p>
        <p>Nach Spielbeginn ergänzen wir die Übersicht um den gemeldeten Spielstand und – sofern verfügbar – Halbzeitstand, Torschützen und Spielminuten. So lässt sich später nachvollziehen, wann sich das Ergebnis verändert hat und wie sich die Partie anhand der dokumentierten Ereignisse entwickelt hat.</p>
        ${previewNote}
        <p class="muted">Aktuell liegen noch keine Ergebnisdaten für diese Begegnung vor. Verifizierte Angaben zu Tabellenform, Aufstellungen, Ausfällen und taktischer Ausrichtung sind ebenfalls nicht verfügbar. Deshalb enthält die Vorschau keine erfundenen Team- oder Spielerinformationen.</p>
      </div>
    `;
  }

  const team1 = m.team1.teamName;
  const team2 = m.team2.teamName;
  const outcome = res.a === res.b
    ? `${m.matchIsFinished ? "Die Begegnung endete" : "Der aktuelle Spielstand lautet"} ${res.a}:${res.b}.`
    : res.a > res.b
      ? `${esc(team1)} ${m.matchIsFinished ? "gewann" : "führt"} mit ${res.a}:${res.b} gegen ${esc(team2)}.`
      : `${esc(team2)} ${m.matchIsFinished ? "gewann" : "führt"} mit ${res.b}:${res.a} gegen ${esc(team1)}.`;
  const goals = (m.goals || [])
    .slice()
    .sort((a, b) => (a.matchMinute ?? Number.MAX_SAFE_INTEGER) - (b.matchMinute ?? Number.MAX_SAFE_INTEGER));
  const goalSummary = goals.length
    ? goals.map(goal => `${goal.matchMinute ?? "ohne Minutenangabe"}. Minute: ${esc(goal.goalGetterName || "Torschütze nicht gemeldet")} (${goal.scoreTeam1}:${goal.scoreTeam2}${goal.isPenalty ? ", Elfmeter" : ""}${goal.isOwnGoal ? ", Eigentor" : ""})`).join("; ")
    : null;
  const halfTimeScore = halfTime(m);
  const statsNote = stats && stats.note ? `<p>${esc(stats.note)}</p>` : "";
  const analysisPoints = [];
  const statCards = [];

  if (stats && stats.possession) {
    const [homePossession, awayPossession] = stats.possession;
    const possessionLeader = homePossession === awayPossession
      ? "Beide Teams hatten laut den gemeldeten Werten gleich viel Ballbesitz."
      : `${esc(homePossession > awayPossession ? team1 : team2)} hatte mit ${Math.max(homePossession, awayPossession)} % den höheren Ballbesitzanteil.`;
    analysisPoints.push(`${possessionLeader} Ballbesitz beschreibt die Zeit mit dem Ball, sagt allein aber nicht aus, welche Mannschaft die besseren Torchancen hatte.`);
  }

  if (stats && stats.shots) {
    const [homeShots, awayShots] = stats.shots;
    const leader = homeShots === awayShots ? "Beide Teams kamen auf gleich viele" : `${esc(homeShots > awayShots ? team1 : team2)} verzeichnete mehr`;
    analysisPoints.push(`${leader} Abschlüsse (${homeShots} zu ${awayShots}).`);
    statCards.push(`<div class="stat"><b>${homeShots} : ${awayShots}</b><span>Schüsse</span></div>`);
  }

  if (stats && stats.shotsOnTarget) {
    const [homeShotsOnTarget, awayShotsOnTarget] = stats.shotsOnTarget;
    const leader = homeShotsOnTarget === awayShotsOnTarget ? "Beide Teams hatten gleich viele" : `${esc(homeShotsOnTarget > awayShotsOnTarget ? team1 : team2)} hatte mehr`;
    analysisPoints.push(`${leader} Schüsse aufs Tor (${homeShotsOnTarget} zu ${awayShotsOnTarget}); dieser Wert zählt nur Abschlüsse, die auf das Tor kamen.`);
    statCards.push(`<div class="stat"><b>${homeShotsOnTarget} : ${awayShotsOnTarget}</b><span>Schüsse aufs Tor</span></div>`);
  }

  if (stats && stats.xg) {
    const [homeXg, awayXg] = stats.xg;
    const leader = homeXg === awayXg ? "Der gemeldete xG-Wert ist für beide Teams gleich" : `${esc(homeXg > awayXg ? team1 : team2)} weist den höheren xG-Wert auf`;
    analysisPoints.push(`${leader} (${homeXg} zu ${awayXg}). xG (Expected Goals) schätzt die Qualität der erfassten Abschlüsse ein und ist kein zusätzlicher Spielstand.`);
    statCards.push(`<div class="stat"><b>${homeXg} : ${awayXg}</b><span>xG</span></div>`);
  }

  const possessionMarkup = stats && stats.possession
    ? `<div class="possession">
        <div class="pos"><strong>${stats.possession[0]}%</strong><div>${esc(team1)}</div><div class="bar"><div class="fill" style="width:${stats.possession[0]}%"></div></div></div>
        <div class="pos"><strong>${stats.possession[1]}%</strong><div>${esc(team2)}</div><div class="bar"><div class="fill" style="width:${stats.possession[1]}%"></div></div>
      </div>`
    : "";
  const venue = m.location && m.location.locationCity ? ` Austragungsort laut Spieldaten: ${esc(m.location.locationCity)}.` : "";
  const status = m.matchIsFinished ? "Auswertung nach Abpfiff" : "Zwischenstand und bisheriger Verlauf";

  return `
    <div class="analysis">
      <div class="analysis-title">${status}</div>
      <p class="description-lead"><strong>${esc(team1)} – ${esc(team2)}</strong>: ${outcome}${m.matchIsFinished ? " Das Spiel ist beendet." : " Die Partie läuft noch."}${venue}</p>
      ${halfTimeScore ? `<p><strong>Halbzeit:</strong> Zur Pause stand es ${esc(halfTimeScore)}. Im Vergleich dazu lautet der ${m.matchIsFinished ? "Endstand" : "aktuelle Spielstand"} ${res.a}:${res.b}.` : ""}
      <p><strong>Spielverlauf:</strong> ${goalSummary ? `Die übermittelten Torereignisse in zeitlicher Reihenfolge: ${goalSummary}.` : "Der Datenanbieter hat für diese Partie keine einzelnen Tore mit Minute oder Torschützen gemeldet. Daher lässt sich aus den verfügbaren Informationen kein genauer Ablauf der Treffer rekonstruieren."}</p>
      ${statsNote}
      ${analysisPoints.length ? `<p><strong>Einordnung der Zahlen:</strong> ${analysisPoints.join(" ")}</p>` : ""}
      ${possessionMarkup}
      ${statCards.length ? `<div class="stat-grid">${statCards.join("")}</div>` : ""}
      <p>Der Spielstand zeigt das Ergebnis, während Halbzeitstand und Torfolge den zeitlichen Rahmen der Partie ergänzen. Wo zusätzliche Werte gemeldet wurden, helfen Ballbesitz, Schüsse und xG dabei, einzelne Aspekte des Spiels getrennt zu betrachten – sie ersetzen jedoch keine vollständigen Daten zu Chancen, Spielphasen oder taktischen Abläufen.</p>
      <p class="muted">Diese Auswertung basiert ausschließlich auf den hier verfügbaren Ergebnis-, Tor- und Statistikdaten. Aufstellungen, Auswechslungen, Karten, Verletzungen und detaillierte Chancenverläufe werden nicht durchgehend geliefert; Aussagen zu diesen Punkten oder zu einer vermeintlichen Überlegenheit lassen sich deshalb nicht verlässlich treffen.</p>
    </div>
  `;
}

      <thead><tr><th>#</th><th class="team">Verein</th><th>Sp</th><th class="hide-s">S-U-N</th><th>Diff</th><th>Pkt</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
  }catch(e){
    setStatus("Tabelle konnte nicht geladen werden. Liga-Kürzel prüfen oder später erneut versuchen.", true);
  }
}

function sportsDbEvents(data){
  return data.events || data.event || [];
}

function sportsDbMatchCard(event){
  const home = event.strHomeTeam || "Heimteam";
  const away = event.strAwayTeam || "Auswärtsteam";
  const hasScore = event.intHomeScore !== undefined && event.intHomeScore !== null && event.intHomeScore !== "" &&
    event.intAwayScore !== undefined && event.intAwayScore !== null && event.intAwayScore !== "";
  const score = hasScore ? `${event.intHomeScore} : ${event.intAwayScore}` : "–";
  const time = event.strTimestamp ? new Date(`${event.strTimestamp}Z`).toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"}) : "";
  return `<article class="match"><div class="match-row">
    <span class="side home">${esc(home)}</span><span class="score">${score}</span><span class="side">${esc(away)}</span>
  </div><p class="meta">${esc(event.dateEvent || "Termin offen")}${time ? ` · ${esc(time)}` : ""}</p></article>`;
}

async function showSportsDbMatches(league){
  setStatus("Lade Spieltag …");
  try{
    const season = `${SEASON}-${SEASON + 1}`;
    if(state.day == null){
      const upcoming = await sportsDb(`eventsnextleague.php?id=${league.leagueId}`);
      const previous = upcoming.events?.length ? null : await sportsDb(`eventspastleague.php?id=${league.leagueId}`);
      const event = upcoming.events?.[0] || previous?.events?.[0];
      state.day = Number(event?.intRound) || 1;
    }
    $("#dayLabel").textContent = `${state.day}. Spieltag`;
    const data = await sportsDb(`eventsround.php?id=${league.leagueId}&r=${state.day}&s=${season}`);
    const events = sportsDbEvents(data).slice().sort((a, b) => String(a.dateEvent || "").localeCompare(String(b.dateEvent || "")));
    if(!events.length) return setStatus(`Für den ${state.day}. Spieltag sind bei der Datenquelle keine Spiele hinterlegt.`);
    const byDay = {};
    events.forEach(event => {
      const key = event.dateEvent || "Termin offen";
      (byDay[key] = byDay[key] || []).push(event);
    });
    content.innerHTML = `<p class="data-note">Spielplandaten: TheSportsDB. Die kostenlose Datenquelle kann unvollständige Spieltage liefern.</p>${Object.entries(byDay).map(([date, games]) => `<section><h2>${esc(date)}</h2>${games.map(sportsDbMatchCard).join("")}</section>`).join("")}`;
  }catch(error){
    setStatus(`Spiele konnten nicht geladen werden: ${error.message}`, true);
  }
}

async function showEspnMatches(){
  setStatus("Lade NBA-Spielplan …");
  try{
    if(state.day == null) state.day = new Date().toISOString().slice(0, 10);
    const day = state.day.replaceAll("-", "");
    $("#dayLabel").textContent = new Date(`${state.day}T12:00:00`).toLocaleDateString("de-DE", {weekday:"long", day:"2-digit", month:"long", year:"numeric"});
    const data = await espn(`sports/basketball/nba/scoreboard?dates=${day}&limit=100`);
    const events = data.events || [];
    if(!events.length) return setStatus("Für diesen Tag sind keine NBA-Spiele angesetzt. Mit den Pfeilen kannst du andere Tage aufrufen.");
    content.innerHTML = events.map(event => {
      const competition = event.competitions?.[0];
      const competitors = competition?.competitors || [];
      const home = competitors.find(team => team.homeAway === "home");
      const away = competitors.find(team => team.homeAway === "away");
      if(!home || !away) return "";
      const completed = event.status?.type?.completed;
      const score = team => team.score ?? "–";
      const date = event.date ? new Date(event.date).toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"}) : "";
      return `<article class="match"><div class="match-row">
        <span class="side home">${esc(home.team.displayName)}</span><span class="score">${completed || home.score ? `${esc(score(home))} : ${esc(score(away))}` : "–"}</span><span class="side">${esc(away.team.displayName)}</span>
      </div><p class="meta">${esc(event.status?.type?.shortDetail || event.status?.type?.detail || "Spiel angesetzt")}${date ? ` · ${esc(date)}` : ""}</p></article>`;
    }).join("");
  }catch(error){
    setStatus(`NBA-Spielplan konnte nicht geladen werden: ${error.message}`, true);
  }
}

async function showSportsDbTable(league){
  setStatus("Lade Tabelle …");
  try{
    const season = `${SEASON}-${SEASON + 1}`;
    const data = await sportsDb(`lookuptable.php?l=${league.leagueId}&s=${season}`);
    const rows = data.table || [];
    if(!rows.length) return setStatus("Für diese Saison sind noch keine Tabellendaten verfügbar.");
    const body = rows.map((row, index) => `<tr>
      <td class="rank">${esc(row.intRank || index + 1)}</td><td class="team">${esc(row.strTeam || "Team")}</td>
      <td>${esc(row.intPlayed ?? "–")}</td><td class="hide-s">${esc(row.intWin ?? "–")}-${esc(row.intDraw ?? "–")}-${esc(row.intLoss ?? "–")}</td>
      <td>${esc(row.intGoalDifference ?? "–")}</td><td class="pts">${esc(row.intPoints ?? "–")}</td>
    </tr>`).join("");
    content.innerHTML = `${rows.length < 10 ? `<p class="data-note">Die Datenquelle stellt derzeit nur ${rows.length} Tabellenplätze bereit; die Anzeige ist daher möglicherweise unvollständig.</p>` : ""}<div class="table-wrap"><table class="standings">
      <thead><tr><th>#</th><th class="team">Verein</th><th>Sp</th><th class="hide-s">S-U-N</th><th>Diff</th><th>Pkt</th></tr></thead><tbody>${body}</tbody></table></div>`;
  }catch(error){
    setStatus(`Tabelle konnte nicht geladen werden: ${error.message}`, true);
  }
}

async function showEspnTable(){
  setStatus("Lade NBA-Tabelle …");
  try{
    const data = await espn("sports/basketball/nba/standings");
    const entries = [];
    const collect = node => {
      if(!node || typeof node !== "object") return;
      if(Array.isArray(node.entries)) entries.push(...node.entries);
      if(Array.isArray(node.children)) node.children.forEach(collect);
      if(node.standings) collect(node.standings);
    };
    collect(data);
    if(!entries.length) return setStatus("Die NBA-Tabelle ist noch nicht verfügbar. Sie erscheint, sobald ESPN aktuelle Ligastände veröffentlicht.");
    content.innerHTML = `<div class="table-wrap"><table class="standings"><thead><tr><th>#</th><th class="team">Team</th><th>Bilanz</th><th class="hide-s">Siege</th></tr></thead><tbody>${entries.map((entry, index) => {
      const wins = entry.stats?.find(stat => stat.name === "wins");
      const losses = entry.stats?.find(stat => stat.name === "losses");
      return `<tr><td class="rank">${index + 1}</td><td class="team">${esc(entry.team?.displayName || entry.team?.name || "Team")}</td><td>${esc(wins?.displayValue || wins?.value || "–")}-${esc(losses?.displayValue || losses?.value || "–")}</td><td class="hide-s">${esc(wins?.displayValue || wins?.value || "–")}</td></tr>`;
    }).join("")}</tbody></table></div>`;
  }catch(error){
    setStatus(`NBA-Tabelle konnte nicht geladen werden: ${error.message}`, true);
  }
}

function matchCard(m){
  const res = finalResult(m);
  const live = !m.matchIsFinished && res;
  const score = res ? `${res.a}:${res.b}` : (m.matchDateTime ? new Date(m.matchDateTime).toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"}) : "–");
  const goals = (m.goals || []).slice().sort((a, b) => a.matchMinute - b.matchMinute);
  const ht = halfTime(m);
  const v = videoLink(m);
  const stats = MATCH_STATS[String(m.matchID)];
  const goalList = goals.length
  ? `
    <ol class="goals">

      ${goals.map(g => `
        <li>

          <span class="goal-icon">⚽</span>

          <span class="min">
            ${g.matchMinute ?? "?"}'
          </span>

          <span class="gs">
            ${g.scoreTeam1}:${g.scoreTeam2}
          </span>

          <span>
            <strong>
              ${esc(g.goalGetterName || "Torschütze unbekannt")}
            </strong>

            ${g.isPenalty ? " · Elfmeter" : ""}
            ${g.isOwnGoal ? " · Eigentor" : ""}
          </span>

        </li>
      `).join("")}

    </ol>
  `
  : `
    <p class="muted">
      ${m.matchIsFinished
        ? "Keine Torinformationen vorhanden."
        : "Noch keine Tore."}
    </p>
  `;
  return `<details class="match ${live ? "live" : ""}">
    <summary>
      ${clubButton({teamName:m.team1.teamName, teamIconUrl:m.team1.teamIconUrl}, "side home")}
      <span class="score">${score}</span>
      ${clubButton({teamName:m.team2.teamName, teamIconUrl:m.team2.teamIconUrl}, "side away")}
    </summary>
    <div class="detail">
      <p class="meta">${esc(fmtDate(m.matchDateTime))}${m.location && m.location.locationCity ? " · " + esc(m.location.locationCity) : ""}${ht ? " · Halbzeit " + ht : ""}${m.numberOfViewers ? " · " + m.numberOfViewers.toLocaleString("de-DE") + " Zuschauer" : ""}</p>
      ${goalList}
      ${buildAnalysis(m, stats, res)}
      ${m.matchIsFinished ? `<a class="video ${v.direct ? "direct" : ""}" href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.label)}</a>` : ""}
      ${broadcastHtml(m)}
    </div>
  </details>`;
}

async function showMatches(){
  const league = LEAGUES.find(item => item.id === state.league);
  if(league.provider === "sportsdb") return showSportsDbMatches(league);
  if(league.provider === "espn") return showEspnMatches();
  setStatus("Lade Spieltag …");
  try{
    if(state.day == null){
      try{ const g = await api(`/getcurrentgroup/${state.league}`); state.day = g.groupOrderID || 1; }
      catch{ state.day = 1; }
    }
    $("#dayLabel").textContent = `${state.day}. Spieltag`;
    const matches = await api(`/getmatchdata/${state.league}/${SEASON}/${state.day}`);
    if(!matches.length) return setStatus("Für diesen Spieltag gibt es keine Spiele.");
    matches.sort((a, b) => new Date(a.matchDateTime) - new Date(b.matchDateTime));
    const byDay = {};
    matches.forEach(m => {
      const key = m.matchDateTime
        ? new Date(m.matchDateTime).toLocaleDateString("de-DE", {weekday:"long", day:"2-digit", month:"long"})
        : "Termin offen";
      (byDay[key] = byDay[key] || []).push(m);
    });
    content.innerHTML = Object.entries(byDay)
      .map(([d, list]) => `<section><h2>${esc(d)}</h2>${list.map(matchCard).join("")}</section>`).join("");
  }catch(e){
    setStatus("Spiele konnten nicht geladen werden. Liga-Kürzel prüfen oder später erneut versuchen.", true);
  }
}

function render(){
  if(state.club){
    showClub(state.club);
    return;
  }
  $("#mdnav").hidden = state.view !== "matches";
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === state.view)));
  state.view === "table" ? showTable() : showMatches();
}

function buildLeagueNav(){
  $("#leagues").innerHTML = LEAGUES.map(l => `<button data-id="${esc(l.id)}" data-sport="${esc(l.sport)}" aria-pressed="${l.id === state.league}">${esc(l.name)}</button>`).join("");
}

$("#leagues").addEventListener("click", e => {
  const b = e.target.closest("button");
  if(!b) return;
  state.club = null;
  state.league = b.dataset.id;
  state.day = null;
  buildLeagueNav();
  loadNews();
render();
});

document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if(!b) return;
  state.club = null;
  state.view = b.dataset.view;
  render();
});

$("#news").addEventListener("click", e => {
  if(!e.target.closest("[data-news-retry]")) return;
  newsCache.delete(state.league);
  loadNews();
});

content.addEventListener("click", e => {
  const retry = e.target.closest("[data-club-retry]");
  if(retry){
    clubCache.delete(state.club);
    showClub(state.club);
    return;
  }
  const back = e.target.closest("[data-club-back]");
  if(back){
    state.club = null;
    clubRequest++;
    render();
    return;
  }
  const team = e.target.closest("[data-team-name]");
  if(team){
    e.preventDefault();
    showClub(team.dataset.teamName);
  }
});

function moveMatchday(offset){
  if(LEAGUES.find(item => item.id === state.league).provider === "espn"){
    const date = new Date(`${state.day || new Date().toISOString().slice(0, 10)}T12:00:00`);
    date.setDate(date.getDate() + offset);
    state.day = date.toISOString().slice(0, 10);
  }else{
    const current = Number(state.day) || 1;
    state.day = Math.max(1, current + offset);
  }
  showMatches();
}

$("#prev").addEventListener("click", () => moveMatchday(-1));
$("#next").addEventListener("click", () => moveMatchday(1));

$("#season").textContent = `Saison ${SEASON}/${String(SEASON + 1).slice(2)}`;
buildLeagueNav();
loadNews();
render();
</script>
</body>
</html>
